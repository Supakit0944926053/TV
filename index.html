        :root {
            --gold: #D4AF37;
            --white: #FFFFFF;
            --accent: #ff4500;

            --bg-review: #2dd4bf; /* สีเขียวมิ้นท์สำหรับรีวิวลูกค้า */
        }
        
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at center, #222 0%, #000 100%);
            font-family: 'Kanit', sans-serif;
            display: flex;
            flex-direction: column;
        }

        .header {
            height: 12vh;
            background: #111115;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 5px solid var(--gold);
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            z-index: 100;
            position: relative;
        }
        .logo { height: 8vh; margin-right: 15px; }
        .shop-name { font-size: 5.5vh; font-weight: 600; color: #ffffff; margin: 0; }
        .shop-name span { color: var(--gold); }

        .header-right {
            position: absolute;
            right: 30px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .info-badge {
            background: rgba(52, 152, 219, 0.2);
            border: 1px solid var(--info);
            color: white;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 1.8vh;
            font-weight: 500;
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.2;
        }

        .holiday-badge {
            background: rgba(217, 83, 79, 0.2);
            border: 1px solid var(--danger);
            color: white;
            padding: 5px 15px;
            border-radius: 8px;
            font-size: 2vh;
            font-weight: 500;
        }

        #display-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            padding: 20px;
            position: relative;
        }

        .menu-card {
            height: 75vh;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-radius: 20px;
            position: relative;
            background: #1a1a1a;
            border: 2px solid rgba(214, 175, 55, 0.4);
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
        }

        /* กรอบทองดารา VIP */
        .special-card {
            border: 3px solid var(--gold);
        }

        /* กรอบสีมิ้นท์รีวิวลูกค้า */
        .review-card {
            border: 3px solid var(--bg-review);
        }

        .thanks-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.98) 0%, rgba(0,0,0,0.7) 60%, transparent 100%);
            padding: 80px 20px 40px 20px;
            color: white;
            text-align: center;
            z-index: 30;
        }

        .thanks-text {
            font-size: 4.8vh;
            font-weight: 600;
            text-shadow: 2px 2px 5px rgba(0,0,0,1), 0 0 25px rgba(212, 175, 55, 0.4);
            line-height: 1.5;
            animation: slideUp 1s ease-out forwards;
        }

        .thanks-text span { 
            color: var(--gold); 
            font-size: 5.8vh;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.6);
        }

        /* ไฮไลท์สำหรับหน้ารีวิวลูกค้า */
        .thanks-text .client-highlight {
            color: var(--bg-review);
            font-size: 5.2vh;
            text-shadow: 0 0 15px rgba(45, 212, 191, 0.4);
        }

        .badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--accent);
            color: white;
            padding: 8px 25px;
            border-radius: 50px;
            font-size: 2.8vh;
            font-weight: bold;
            z-index: 10;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .menu-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            animation: kenburns 15s ease-in-out infinite alternate;
        }

        @keyframes kenburns {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ticker-wrap {
            width: 100%;
            overflow: hidden;
            background: linear-gradient(90deg, var(--gold), #f3d060, var(--gold));
            color: #000;
            height: 4.5vh;
            display: flex;
            align-items: center;
        }

        .ticker-move {
            white-space: nowrap;
            animation: ticker 40s linear infinite;
            font-weight: 500;
            font-size: 2.4vh;
        }

        @keyframes ticker {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        .footer {
            height: 6vh;
            background: #000;
            color: var(--white);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            border-top: 1px solid rgba(255,255,255,0.05);

        .footer-text { font-size: 2.8vh; }
        .footer-text b { color: var(--gold); }

        .fade-in {
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

                // ถึงจะทำการเปลี่ยนโหมดสลับวนกลับไปขึ้นรูปดารา VIP เพื่อเริ่มลูปใหม่ตามลำดับ
                if (reviewIdx >= reviewSets.length) {
                    reviewIdx = 0; // รีเซ็ตตัวนับรีวิวกลับไปเริ่มชุดแรก
                    currentMode = 'celeb'; // เปลี่ยนโหมดไปที่ดารา
                }

            } else {
                // ================= [ช่วงที่ 2] แสดงรูปเมนูอาหารปกติ (ทีละ 2 รูป) =================
                displayTime = 10000; // หน้าเมนูอาหารค้าง 10 วินาที
                
                for (let i = 0; i < 2; i++) {
                    if (menuIdx < menuImages.length) {
                        const card = document.createElement('div');
                        card.className = 'menu-card fade-in';
                        
                        if (Math.random() > 0.6) {
                            const b = document.createElement('div');
                            b.className = 'badge';
                            b.innerText = badges[Math.floor(Math.random() * badges.length)];
                            card.appendChild(b);
                        }

                        const img = document.createElement('img');
                        img.className = 'menu-img';
                        img.src = menuImages[menuIdx];
                        card.appendChild(img);
                        area.appendChild(card);
                        menuIdx++;
                    }
                }

                // เมื่อเปิดวนจนครบเมนูสุดท้าย (ครบ 49 รูป) ➔ บังคับตัดเข้าหน้ารีวิวลูกค้าต่อทันที
                if (menuIdx >= menuImages.length) {
                    menuIdx = 0; // รีเซ็ตตัวนับเพื่อรอบถัดไป
                    currentMode = 'review';
                }
            }

            clearTimeout(timeoutHandle);
            timeoutHandle = setTimeout(updateDisplay, displayTime);
        }

        // เริ่มต้นรันระบบ
        updateDisplay();
    </script>
</body>
</html>
